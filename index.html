*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif;background:linear-gradient(135deg,#f5f7fa,#e8ecf1);color:#333;}
header{background:linear-gradient(135deg,#006b54,#008060);color:white;padding:50px 20px;text-align:center;box-shadow:0 4px 15px rgba(0,107,84,0.15);}
header h1{font-size:3em;margin-bottom:10px;animation:fadeIn 1s;}
header p{font-size:1.2em;opacity:0.9;animation:fadeIn 1.5s;}
.language-switch{margin-top:15px;display:flex;justify-content:center;gap:10px;}
.language-switch button{display:flex;align-items:center;gap:5px;padding:8px 14px;border:none;border-radius:5px;background:rgba(255,255,255,0.3);color:white;cursor:pointer;transition:0.3s;}
.language-switch button.active{background:white;color:#008060;font-weight:600;}
.language-switch img{width:22px;height:14px;}
nav{background:#2c3e50;padding:15px;text-align:center;display:flex;justify-content:center;flex-wrap:wrap;gap:10px;position:sticky;top:0;z-index:10;}
nav button{color:white;background:transparent;border:2px solid rgba(255,255,255,0.4);padding:10px 18px;font-size:16px;cursor:pointer;border-radius:25px;transition:0.3s;font-weight:500;}
nav button:hover,nav button.active{background:#008060;border-color:#008060;}
.container{padding:40px 20px;max-width:1300px;margin:0 auto;}
.cards-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:30px;}
.card{background:white;border-radius:15px;overflow:hidden;box-shadow:0 4px 20px rgba(0,0,0,0.08);transition:0.35s;cursor:pointer;animation:fadeIn 0.8s;}
.card:hover{transform:translateY(-6px);box-shadow:0 10px 30px rgba(0,0,0,0.15);}
.card-image{position:relative;overflow:hidden;height:180px;}
.card-image img{width:100%;height:100%;object-fit:cover;transition:transform 0.5s;}
.card:hover .card-image img{transform:scale(1.08);}
.card-category{position:absolute;top:10px;right:10px;background:rgba(0,128,96,0.9);color:white;padding:5px 12px;border-radius:20px;font-size:12px;font-weight:600;text-transform:uppercase;}
.card-content{padding:18px;}
.card h2{font-size:1.4em;color:#2c3e50;margin-bottom:6px;}
.card p{color:#666;font-size:0.95em;line-height:1.5;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
.modal{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.7);z-index:200;align-items:center;justify-content:center;}
.modal.active{display:flex;}
.modal-content{background:white;border-radius:20px;max-width:700px;width:90%;max-height:90vh;overflow-y:auto;position:relative;animation:fadeIn 0.5s;}
.modal-close{position:absolute;top:18px;right:18px;width:38px;height:38px;background:rgba(0,0,0,0.1);border:none;border-radius:50%;font-size:24px;cursor:pointer;}
.modal-image{width:100%;height:300px;object-fit:cover;border-top-left-radius:20px;border-top-right-radius:20px;}
.modal-body{padding:28px;}
.modal-body h2{font-size:2em;color:#2c3e50;margin-bottom:10px;}
.modal-body p{color:#444;line-height:1.7;margin-bottom:12px;font-size:1em;}
.modal-category{display:inline-block;background:#008060;color:white;padding:6px 14px;border-radius:20px;font-size:12px;font-weight:600;text-transform:uppercase;margin-bottom:12px;}
button.link-btn{padding:10px 18px;background:#008060;color:white;border:none;border-radius:8px;font-size:0.95em;cursor:pointer;transition:0.3s;}
button.link-btn:hover{transform:translateY(-2px);box-shadow:0 6px 15px rgba(0,128,96,0.3);}
footer{background:#2c3e50;color:white;text-align:center;padding:24px;margin-top:30px;}
@keyframes fadeIn{from{opacity:0;}to{opacity:1;}}
</style>
</head>

<button data-lang="ru"><img src="https://flagcdn.com/ru.svg" alt="RU"> Русский</button>

</div>

// Render funksiyasi
function renderCards(){
const container=document.getElementById('cards-container');
let filtered=allLocations.filter(loc=>currentFilter==='all'||loc.category===currentFilter);
container.innerHTML=filtered.map(loc=>`
<div class="card" onclick="openModal('${loc.id}')">
<div class="card-image">
<img src="${loc.image_url}" alt="${loc.name[currentLang]}" loading="lazy">
<span class="card-category">${loc.category==='natural'?lang('Tabiat'):lang('Tarixiy')}</span>
</div>
<div class="card-content">
<h2>${loc.name[currentLang]}</h2>
<p>${loc.description[currentLang]}</p>
</div>
</div>`).join('');
}

// Til funksiyasi
function lang(text){switch(currentLang){case'uz':return text;case'ru':return text==='Tabiat'?'Природа':'Историческое';case'en':return text==='Tabiat'?'Nature':'Historical';default:return text;}}

// Modal funksiyasi
function openModal(id){
const loc=allLocations.find(l=>l.id===id);if(!loc)return;
document.getElementById('modal-image').src=loc.image_url;
document.getElementById('modal-title').textContent=loc.name[currentLang];
document.getElementById('modal-category').textContent=loc.category==='natural'?lang('Tabiat'):lang('Tarixiy');
document.getElementById('modal-description').textContent=loc.description[currentLang];
document.getElementById('modal-history').textContent=loc.history[currentLang];
document.getElementById('modal-architecture').textContent=loc.architecture[currentLang];
document.getElementById('modal-best-time').textContent=loc.best_time_to_visit[currentLang];
document.getElementById('modal-fun-fact').textContent=loc.fun_fact[currentLang];
document.getElementById('modal-map-link').href=loc.map_url;
document.getElementById('modal').classList.add('active');
document.body.style.overflow='hidden';
}
function closeModal(){document.getElementById('modal').classList.remove('active');document.body.style.overflow='auto';}
document.getElementById('modal').addEventListener('click',e=>{if(e.target.id==='modal')closeModal();});
document.querySelector('.modal-close').addEventListener('click',closeModal);

// Filter tugmalari
document.querySelectorAll('nav button').forEach(btn=>{
btn.addEventListener('click',e=>{
document.querySelectorAll('nav button').forEach(b=>b.classList.remove('active'));
e.target.classList.add('active');
currentFilter=e.target.dataset.filter;
renderCards();
});
});

// Til tugmalari
document.querySelectorAll('.language-switch button').forEach(btn=>{
btn.addEventListener('click',e=>{
document.querySelectorAll('.language-switch button').forEach(b=>b.classList.remove('active'));
e.target.classList.add('active');
currentLang=e.target.dataset.lang;
renderCards();
});
});

// Dastlabki render
renderCards();
</script>
