<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Discover Uzbekistan</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif;background:linear-gradient(135deg,#f5f7fa 0%,#e8ecf1 100%);color:#333;}
header{background:linear-gradient(135deg,#006b54 0%,#008060 100%);color:white;padding:50px 20px;text-align:center;box-shadow:0 4px 15px rgba(0,107,84,0.15);}
header h1{font-size:3em;margin-bottom:10px;}
header p{font-size:1.2em;opacity:0.95;}
nav{background:#2c3e50;padding:15px;text-align:center;display:flex;justify-content:center;flex-wrap:wrap;gap:10px;position:sticky;top:0;z-index:10;box-shadow:0 2px 8px rgba(0,0,0,0.1);}
nav button{color:white;background:transparent;border:2px solid rgba(255,255,255,0.3);padding:10px 20px;font-size:16px;cursor:pointer;border-radius:25px;transition:all 0.3s ease;font-weight:500;}
nav button:hover,nav button.active{background:#008060;border-color:#008060;}
.language-switch{margin-left:10px;display:flex;align-items:center;gap:10px;}
.language-switch img{width:24px;height:16px;cursor:pointer;border:1px solid #fff;border-radius:3px;}
.container{padding:40px 20px;max-width:1200px;margin:0 auto;}
.cards-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:30px;}
.card{background:white;border-radius:15px;overflow:hidden;box-shadow:0 4px 20px rgba(0,0,0,0.08);transition:all 0.35s cubic-bezier(0.4,0,0.2,1);cursor:pointer;}
.card:hover{transform:translateY(-8px);box-shadow:0 12px 35px rgba(0,0,0,0.15);}
.card-image{position:relative;overflow:hidden;height:220px;}
.card-image img{width:100%;height:100%;object-fit:cover;transition:transform 0.5s ease;}
.card:hover .card-image img{transform:scale(1.08);}
.card-category{position:absolute;top:15px;right:15px;background:rgba(0,128,96,0.9);color:white;padding:6px 14px;border-radius:20px;font-size:12px;font-weight:600;text-transform:uppercase;z-index:2;}
.card-content{padding:25px;}
.card h2{font-size:1.5em;margin-bottom:10px;color:#2c3e50;font-weight:700;}
.card p{color:#666;line-height:1.6;margin-bottom:15px;font-size:0.95em;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
.modal{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.6);z-index:100;align-items:center;justify-content:center;}
.modal.active{display:flex;}
.modal-content{background:white;border-radius:20px;max-width:600px;width:90%;max-height:90vh;overflow-y:auto;position:relative;}
.modal-close{position:absolute;top:20px;right:20px;width:40px;height:40px;background:rgba(0,0,0,0.1);border:none;border-radius:50%;font-size:24px;cursor:pointer;transition:all 0.3s ease;}
.modal-close:hover{background:rgba(0,0,0,0.2);transform:rotate(90deg);}
.modal-image{width:100%;height:300px;object-fit:cover;}
.modal-body{padding:30px;}
.modal-body h2{font-size:2em;color:#2c3e50;margin-bottom:10px;}
.modal-category{display:inline-block;background:#008060;color:white;padding:6px 14px;border-radius:20px;font-size:12px;font-weight:600;text-transform:uppercase;margin-bottom:20px;}
.modal-body p{color:#666;line-height:1.8;margin-bottom:15px;font-size:1em;}
.modal-buttons{display:flex;gap:10px;flex-wrap:wrap;}
button.link-btn{padding:10px 18px;background:#008060;color:white;border:none;border-radius:8px;cursor:pointer;text-decoration:none;display:inline-block;font-weight:600;}
footer{background:#2c3e50;color:white;text-align:center;padding:30px;margin-top:40px;}
@media(max-width:768px){header h1{font-size:2em;}.cards-grid{grid-template-columns:1fr;}.language-switch{justify-content:center;}}
</style>
</head>
<body>
<header>
<h1>🇺🇿 Discover Uzbekistan</h1>
<p id="header-text">Uzbekistondagi eng chiroyli joylar</p>
<div class="language-switch">
<img src="uz_flag.png" alt="UZ" data-lang="uz">
<img src="ru_flag.png" alt="RU" data-lang="ru">
<img src="en_flag.png" alt="EN" data-lang="en">
</div>
</header>
<nav id="nav">
<button class="active" data-filter="all">Barchasi</button>
<button data-filter="natural">Tabiat</button>
<button data-filter="historical">Tarixiy joylar</button>
</nav>
<div class="container">
<div id="cards-container" class="cards-grid"></div>
</div>
<div id="modal" class="modal">
<div class="modal-content">
<button class="modal-close">&times;</button>
<img id="modal-image" class="modal-image" src="" alt="">
<div class="modal-body">
<span id="modal-category" class="modal-category"></span>
<h2 id="modal-title"></h2>
<p id="modal-description"></p>
<p><strong>Tarixi:</strong> <span id="modal-history"></span></p>
<p><strong>Me'morchilik:</strong> <span id="modal-architecture"></span></p>
<p><strong>Eng yaxshi vaqt:</strong> <span id="modal-best-time"></span></p>
<p><strong>Qiziqarli fakt:</strong> <span id="modal-fun-fact"></span></p>
<div class="modal-buttons">
<a id="modal-map-link" href="" target="_blank"><button class="link-btn">🗺️ Xaritada ko'rish</button></a>
</div>
</div>
</div>
</div>
<footer>
<p>© 2026 Discover Uzbekistan - O'zbekistagi tabiiy va tarixiy joylarni o'rganish</p>
</footer>

<script>
let currentLang='uz';
let currentFilter='all';

// 20+ O‘zbekiston mashhur joylari
const allLocations=[
{id:"1",category:"historical",image_url:"images/registon.jpg",map_url:"https://goo.gl/maps/xxxx",name:{uz:"Registon, Samarqand",ru:"Регистан, Самарканд",en:"Registan, Samarkand"},description:{uz:"O'zbekistonning eng mashhur tarixiy yodgorligi.",ru:"Самая известная историческая достопримечательность Узбекистана.",en:"Uzbekistan's most famous historical monument."},history:{uz:"1400-yillarda qurilgan madrasa majmuasi...",ru:"Комплекс медресе, построенный в 1400-х годах...",en:"Madrasa complex built in 1400s..."},architecture:{uz:"Islomiy me'morchilik uslubi...",ru:"Исламский архитектурный стиль...",en:"Islamic architectural style..."},best_time_to_visit:{uz:"Bahor va kuz",ru:"Весна и осень",en:"Spring and Autumn"},fun_fact:{uz:"Registon nomi 'qum maydoni' degan ma'noni anglatadi.",ru:"Название Регистан означает 'песчаная площадь'.",en:"Registan means 'sand square'."}},
{id:"2",category:"natural",image_url:"images/aydar.jpg",map_url:"https://goo.gl/maps/yyyy",name:{uz:"Aydar ko'li",ru:"Озеро Айдар",en:"Aydar Lake"},description:{uz:"O'zbekistonning mashhur tabiiy ko'llaridan biri.",ru:"Одно из знаменитых природных озер Узбекистана.",en:"One of Uzbekistan's famous natural lakes."},history:{uz:"...",ru:"...",en:"..."},architecture:{uz:"...",ru:"...",en:"..."},best_time_to_visit:{uz:"Bahor va yoz",ru:"Весна и лето",en:"Spring and Summer"},fun_fact:{uz:"...",ru:"...",en:"..."}},
{id:"3",category:"historical",image_url:"images/bibi.jpg",map_url:"https://goo.gl/maps/zzzz",name:{uz:"Bibi Xonim",ru:"Биби Ханум",en:"Bibi Khanum"},description:{uz:"Samarqanddagi mashhur madrasa.",ru:"Известная медресе в Самарканде.",en:"Famous madrasa in Samarkand."},history:{uz:"1399-yilda qurilgan...",ru:"Построена в 1399 году...",en:"Built in 1399..."},architecture:{uz:"Islomiy me'morchilik.",ru:"Исламская архитектура.",en:"Islamic architecture."},best_time_to_visit:{uz:"Bahor",ru:"Весна",en:"Spring"},fun_fact:{uz:"Eng katta madrasa.",ru:"Самая большая медресе.",en:"Largest madrasa."}},
// Shu tarzda 4–20+ gacha joylarni qo‘shing: Xiva, Shahrisabz, Chimgan, Charvak, Fergana vodiysi, etc.
];

function filterAndRender(){
const container=document.getElementById('cards-container');
let filtered=allLocations;
if(currentFilter!=='all') filtered=allLocations.filter(l=>l.category===currentFilter);
if(filtered.length===0){container.innerHTML='<p>Joylar topilmadi</p>';return;}
container.innerHTML=filtered.map(l=>`
<div class="card" data-id="${l.id}">
<div class="card-image">
<img src="${l.image_url}" alt="${l.name[currentLang]}">
<span class="card-category">${l.category==="natural"?"Tabiat":"Tarixiy"}</span>
</div>
<div class="card-content">
<h2>${l.name[currentLang]}</h2>
<p class="card-description">${l.description[currentLang]}</p>
</div>
</div>
`).join('');
document.querySelectorAll('.card').forEach(card=>{
card.addEventListener('click',function(){openModal(this.dataset.id);});
});
}

function openModal(id){
const loc=allLocations.find(l=>l.id===id);
if(!loc)return;
document.getElementById('modal-image').src=loc.image_url;
document.getElementById('modal-title').textContent=loc.name[currentLang];
document.getElementById('modal-category').textContent=loc.category==="natural"?"Tabiat":"Tarixiy";
document.getElementById('modal-description').textContent=loc.description[currentLang];
document.getElementById('modal-history').textContent=loc.history[currentLang];
document.getElementById('modal-architecture').textContent=loc.architecture[currentLang];
document.getElementById('modal-best-time').textContent=loc.best_time_to_visit[currentLang];
document.getElementById('modal-fun-fact').textContent=loc.fun_fact[currentLang];
document.getElementById('modal-map-link').href=loc.map_url;
document.getElementById('modal').classList.add('active');
document.body.style.overflow='hidden';
}

function closeModal(){
document.getElementById('modal').classList.remove('active');
document.body.style.overflow='auto';
}

document.querySelector('.modal-close').addEventListener('click',closeModal);
document.getElementById('modal').addEventListener('click',e=>{if(e.target.id==='modal')closeModal();});
document.querySelectorAll('nav button').forEach(btn=>{
btn.addEventListener('click',e=>{
document.querySelectorAll('nav button').forEach(b=>b.classList.remove('active'));
e.target.classList.add('active');
currentFilter=e.target.dataset.filter;
filterAndRender();
});
});
document.querySelectorAll('.language-switch img').forEach(img=>{
img.addEventListener('click',e=>{
currentLang=e.target.dataset.lang;
const headerTexts={uz:"Uzbekistondagi eng chiroyli joylar",ru:"Самые красивые места Узбекистана",en:"Most beautiful places in Uzbekistan"};
document.getElementById('header-text').textContent=headerTexts[currentLang];
filterAndRender();
});
});
filterAndRender();
</script>
</body>
</html>
