<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<title>DiscoverUzbekistan</title>

<link rel="stylesheet" href="style.css">

<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

</head>

<body>

<!-- Logo / Hero Section -->
<section class="hero">
<img src="https://via.placeholder.com/250x100?text=DiscoverUzbekistan" alt="DiscoverUzbekistan Logo" class="logo">
<h1>O'zbekistondagi eng chiroyli joylarni kashf eting</h1>
</section>

<!-- Places Section -->
<section class="places">
<h2>Mashhur joylar</h2>
<div class="cards">

<div class="card" onclick="showDetails('registan')">
<img src="https://images.unsplash.com/photo-1606149059549-604ef2c16a1c" alt="Registan">
<h3>Registan</h3>
</div>

<div class="card" onclick="showDetails('charvak')">
<img src="https://images.unsplash.com/photo-1507525428034-b723cf961d3e" alt="Charvak">
<h3>Charvak</h3>
</div>

<div class="card" onclick="showDetails('bukhara')">
<img src="https://images.unsplash.com/photo-1576675787428-0d7424f3e2e6" alt="Bukhara">
<h3>Bukhara</h3>
</div>

</div>
</section>

<!-- Detail Modal -->
<div id="modal" class="modal">
<div class="modal-content">
<span class="close" onclick="closeModal()">&times;</span>
<h2 id="placeName"></h2>
<p id="placeDesc"></p>
<p id="placeDistance"></p>
<p id="placeCost"></p>
<button onclick="showMap()">Xaritadan ko'rish</button>

<div id="map" style="height:400px; margin-top:20px; display:none;"></div>
</div>
</div>

<script src="script.js"></script>
</body>
</html>
