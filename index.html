<!DOCTYPE html>
<html lang="uz">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Discover Uzbekistan</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Poppins;
}

body{
background:#f4f6f9;
}

header{
height:90vh;
background:url("https://images.unsplash.com/photo-1587135941948-670b381f08ce") center/cover;
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
color:white;
text-align:center;
}

header h1{
font-size:60px;
}

header p{
font-size:20px;
}

nav{
background:#111;
padding:15px;
text-align:center;
}

nav a{
color:white;
margin:15px;
text-decoration:none;
font-size:18px;
}

.controls{
text-align:center;
margin:25px;
}

.controls input{
padding:10px;
width:250px;
border-radius:6px;
border:1px solid #ccc;
}

.controls select{
padding:10px;
margin-left:10px;
border-radius:6px;
}

.container{
padding:40px;
}

.grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
gap:30px;
}

.card{
background:white;
border-radius:10px;
overflow:hidden;
box-shadow:0 10px 20px rgba(0,0,0,0.1);
transition:0.4s;
}

.card:hover{
transform:scale(1.05);
}

.card img{
width:100%;
height:200px;
object-fit:cover;
}

.card h3{
padding:15px;
}

.card p{
padding:0 15px 10px 15px;
}

button{
margin:15px;
padding:10px 15px;
background:#008060;
color:white;
border:none;
border-radius:6px;
cursor:pointer;
}

footer{
background:#111;
color:white;
text-align:center;
padding:30px;
margin-top:40px;
}

</style>

</head>

<body>

<header>
<h1>Discover Uzbekistan</h1>
<p>Uzbekistondagi eng chiroyli tabiat va tarixiy joylar</p>
</header>

<nav>
<a href="#nature">Tabiat</a>
<a href="#history">Tarixiy joylar</a>
</nav>

<div class="controls">

<input type="text" id="search" placeholder="Joy qidirish...">

<select id="currency">
<option value="uzs">UZS</option>
<option value="usd">USD</option>
</select>

</div>

<div class="container">

<h2 id="nature">Tabiat joylari</h2>

<div class="grid">

<div class="card">

<img src="https://images.unsplash.com/photo-1600880292203-757bb62b4baf">

<h3>Charvak</h3>

<p class="price" data-uzs="200000">200000 so'm</p>

<a href="https://maps.google.com/?q=charvak" target="_blank">
<button>Xaritada ko‘rish</button>
</a>

</div>

<div class="card">

<img src="https://images.unsplash.com/photo-1526778548025-fa2f459cd5c1">

<h3>Amirsoy</h3>

<p class="price" data-uzs="500000">500000 so'm</p>

<a href="https://maps.google.com/?q=amirsoy" target="_blank">
<button>Xaritada ko‘rish</button>
</a>

</div>

<div class="card">

<img src="https://images.unsplash.com/photo-1500530855697-b586d89ba3ee">

<h3>Zaamin</h3>

<p class="price" data-uzs="300000">300000 so'm</p>

<a href="https://maps.google.com/?q=zaamin" target="_blank">
<button>Xaritada ko‘rish</button>
</a>

</div>

</div>

</div>

<footer>

<p>© Discover Uzbekistan</p>

</footer>

<script>

const search = document.getElementById("search")

search.addEventListener("keyup",function(){

const value = search.value.toLowerCase()

const cards = document.querySelectorAll(".card")

cards.forEach(card=>{

const title = card.querySelector("h3").innerText.toLowerCase()

card.style.display = title.includes(value) ? "block":"none"

})

})

const currency = document.getElementById("currency")

currency.addEventListener("change",function(){

const prices = document.querySelectorAll(".price")

prices.forEach(p=>{

const uzs = p.dataset.uzs

if(currency.value=="usd"){

p.innerText = (uzs/11000).toFixed(2)+" $"

}else{

p.innerText = uzs+" so'm"

}

})

})

</script>

</body>

</html>
